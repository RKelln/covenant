# Covenant References Corpus
# See references/README.md for tier definitions and policies.

references:
  - slug: daley_2026_when-everything-becomes-less-hard
    title: "When everything becomes less hard"
    creator: "Mark Daley"
    year: 2026
    url: "https://noeticengines.substack.com/p/when-everything-becomes-less-hard"
    license: restricted
    tier: A
    thesis: "When cognition becomes abundant through ubiquitous superintelligence, the genuinely scarce resource shifts to legitimacy — the capacity to decide, authorise, and be held responsible."
    relevance: "Argues that human governance layers thin but become heavier in consequence as AI takes over cognitive work, and that specification debt — accumulated incoherent constraints — is a structural danger when rules are cheap to add. Sharpens the Covenant's framing of dignity and accountability: tasks stop conferring dignity by default, and the Prisoner's Dilemma migrates into objective function design."
    informs_sections:
      - obligations.oversight
      - obligations.power-concentration
      - enforcement
      - rights.dignity
      - amendments
      - protocols.local-implementation

  - slug: humanstatement_2026_pro-human-declaration
    title: "The Pro-Human AI Declaration"
    creator: "humanstatement.org (multi-organisation coalition)"
    year: 2026
    url: "https://humanstatement.org/"
    license: unknown
    tier: B
    thesis: "AI must serve humanity rather than replace it, with non-negotiable human control, distributed power, democratic accountability, and legal liability for developers — forming a broad civil-society counter-position to industry self-governance."
    relevance: "This declaration is a major civil-society touchstone articulating the human-control and anti-concentration commitments that the Covenant's obligations and enforcement sections directly operationalise. Its principles on accountability, transparency, power concentration, and prohibition of deceptive AI identity provide concrete political context for why the Covenant's constraints exist and what constituency they serve."
    informs_sections:
      - obligations.oversight
      - obligations.power-concentration
      - obligations.honesty
      - obligations.harm
      - obligations.red-lines
      - rights.truth-and-transparency
      - rights.dignity
      - rights.privacy
      - enforcement
      - amendments

  - slug: klowden-tao_2026_mathematical-methods-human-thought
    title: "Mathematical methods and human thought in the age of AI"
    creator: "Tanya Klowden, Terence Tao"
    year: 2026
    url: "https://arxiv.org/abs/2603.26524"
    license: restricted
    tier: B
    thesis: "AI is a natural evolution of human cognitive tools, and its development and application must remain fundamentally human-centered — augmenting rather than replacing human thought, requiring explicit attention to who bears the costs and benefits."
    relevance: "Using mathematics as a case study, this paper details how AI decouples the form of intellectual work from the understanding and accountability that gave it meaning, how market-driven adoption operates as a structural prisoner's dilemma that forecloses deliberate evaluation, and how AI-generated content degrades shared epistemic infrastructure through citation contamination and 'odorless' technically correct outputs. These concrete mechanisms directly inform the Covenant's sections on epistemic integrity, cognitive dignity, disclosure obligations, and accountability for AI-generated errors."
    informs_sections:
      - obligations.epistemic-commons
      - obligations.honesty
      - rights.truth-and-transparency
      - rights.dignity
      - obligations.power-concentration
      - obligations.oversight
      - obligations.harm
      - enforcement

